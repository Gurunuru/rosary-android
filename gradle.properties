org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------
# Google Play 앱 ID (패키지 이름)
# Play Console에 처음 올린 뒤에는 절대 바꿀 수 없습니다.
# 영문 소문자/숫자/점만, 예: com.maria.rosary
APP_ID=com.mukjugido.rosary

# 버전 번호 = GitHub 빌드 번호 + 이 값. 저장소를 새로 만들어 빌드 번호가 1부터
# 다시 시작하면, 이전에 올린 번호보다 커지도록 이 값을 올려 주세요.
VERSION_OFFSET=0
# ---------------------------------------------------------------
